version: 2
updates:
  # Enable version updates for pnpm (uses "npm" ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # Merges to the default branch trigger a deploy, so batch routine bumps
    # into one PR per ecosystem. Major bumps stay individual.
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Enable version updates for php
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      composer-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Keep GitHub Actions SHA pins current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
