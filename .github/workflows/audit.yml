name: Dependency audit

# Not part of the deploy gate: runs on dependency-touching PRs and weekly, so a
# newly disclosed advisory against something already in a lockfile surfaces
# (GitHub emails on a failed scheduled run) without blocking unrelated deploys.
on:
  pull_request:
    paths:
      - "composer.lock"
      - "composer.json"
      - "pnpm-lock.yaml"
      - "package.json"
  schedule:
    - cron: "0 7 * * 1" # Monday 07:00 UTC
  workflow_dispatch: {}

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'

      # Version is read from package.json's "packageManager" field.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.x"

      - name: Audit composer dependencies
        run: composer audit --locked --no-interaction

      - name: Audit pnpm dependencies
        run: pnpm audit --audit-level=high
